name: build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

  push:
    branches:
      - "master"
      - "v2"
      # v3's development branch, intended to become the default one.
      - "modular"
    tags:
      - "v*"
    paths-ignore:
      - "**.md"

  pull_request:
    paths-ignore:
      - "**.md"

env:
  DOCKERHUB_SLUG: ${{ github.repository }}
  GHCR_SLUG: ghcr.io/${{ github.repository }}

jobs:
  # Which engines to build, and under what tags. Both are discovered from the
  # engines themselves rather than listed here, so adding an engine directory
  # is the whole of adding it to CI -- the same rule `make build-all` and
  # tests/dockermatrix.sh already follow.
  prepare:
    runs-on: ubuntu-latest

    if: github.event_name != 'pull_request'
    outputs:
      platforms: |
        ["linux/amd64", "linux/arm64"]
      engines: ${{ steps.engines.outputs.engines }}
      tags: ${{ steps.engines.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Every engine declaring needs_docker=yes, paired with the tag its
      # engine.conf `image=` key claims. That key is what the wrapper pulls at
      # run time, so building under any other name would produce images no
      # installed pdfulator ever looks for.
      - name: Discover container engines
        id: engines
        run: |
          pairs=$(for conf in engines/*/engine.conf; do
            grep -q '^needs_docker=yes' "$conf" || continue
            id=${conf#engines/}; id=${id%/engine.conf}
            # `image=owner/repo:tag` -> `tag`. The owner/repo half is supplied
            # by DOCKERHUB_SLUG/GHCR_SLUG, so only the tag travels.
            tag=$(sed -n 's/^image=//p' "$conf" | head -1 | sed 's/.*://')
            [ -n "$tag" ] || { echo "engines/$id: image= has no tag" >&2; exit 1; }
            printf '{"engine":"%s","tag":"%s"}\n' "$id" "$tag"
          done | jq -cs .)

          [ "$pairs" != "[]" ] || { echo "no container engines found" >&2; exit 1; }

          # A flat id list, because a job matrixing engine *and* platform needs
          # two independent dimensions -- `include:` only augments combinations
          # that already exist, it does not multiply them.
          echo "engines=$(echo "$pairs" | jq -c 'map(.engine)')" >> "$GITHUB_OUTPUT"

          # ...and an id -> tag lookup for the jobs that need the tag too.
          echo "tags=$(echo "$pairs" | jq -c 'map({(.engine): .tag}) | add')" >> "$GITHUB_OUTPUT"
          echo "Building: $pairs"

  # One tag set per engine. metadata-action computes a single set per run, and
  # the sets differ per engine (`vivlio-3.0.0` vs `pandoc-xslt-3.0.0`), so this
  # runs once per engine rather than once overall.
  meta:
    runs-on: ubuntu-latest

    if: github.event_name != 'pull_request'

    needs:
      - prepare

    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJson(needs.prepare.outputs.engines) }}

    env:
      ENGINE_TAG: ${{ fromJson(needs.prepare.outputs.tags)[matrix.engine] }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The engine id is the primary tag, and every version tag is suffixed
      # with it. `:vivlio` is the moving latest for that engine, `:vivlio-3.0.0`
      # a pinned one. There is deliberately no bare `:latest` or `:3.0.0` any
      # more: with three engines in one repository, an unsuffixed tag would
      # have to mean one arbitrary engine, and silently gave whichever built
      # last.
      #
      # The bare `:<engine>` tag is what engine.conf's `image=` key names, so
      # it is what an installed pdfulator pulls at run time. Something must
      # produce it or no installed pdfulator can pull anything.
      #
      # It moves on any release tag, prerelease included. That is a deliberate
      # choice for the v3 development phase: there is no stable v3 yet, so
      # gating on one would leave `:vivlio` frozen at v2 -- or absent -- while
      # every v3 image sat behind a version-pinned name nobody would guess.
      # Revisit at 3.0.0: once a stable release exists, a prerelease moving the
      # tag every user pulls is exactly what calling it a prerelease denies.
      #
      # Not a default-branch push, though, in either phase: that would let any
      # untested commit become what every user pulls.
      - name: Is this a release build?
        id: channel
        run: |
          # Any v* tag. The hyphen split (v3.0.0-alpha1 vs v3.0.0) is what a
          # stable-only gate would key on; see above for why it is not used yet.
          case "$GITHUB_REF" in
            refs/tags/v*) echo "release=true"  >> "$GITHUB_OUTPUT" ;;
            *)            echo "release=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKERHUB_SLUG }}
            ${{ env.GHCR_SLUG }}
          flavor: |
            latest=false
            suffix=-${{ env.ENGINE_TAG }},onlatest=true
          tags: |
            type=raw,value=${{ env.ENGINE_TAG }},suffix=,enable=${{ steps.channel.outputs.release }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Rename meta bake definition file
        run: |
          mv "${{ steps.meta.outputs.bake-file }}" "/tmp/bake-meta.json"

      - name: Upload meta bake definition
        uses: actions/upload-artifact@v5
        with:
          name: bake-meta-${{ matrix.engine }}
          path: /tmp/bake-meta.json
          if-no-files-found: error
          retention-days: 1

  # engine x platform. fail-fast stays off so one engine breaking does not
  # cancel the others' builds -- pandoc-xslt fetching FOP from archive.apache.org
  # is the flakiest step here and should not take vivlio down with it.
  build:
    runs-on: ubuntu-latest

    if: github.event_name != 'pull_request'

    needs:
      - prepare
      - meta

    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.prepare.outputs.platforms) }}
        engine: ${{ fromJson(needs.prepare.outputs.engines) }}

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v5

      - name: Download meta bake definition
        uses: actions/download-artifact@v6
        with:
          name: bake-meta-${{ matrix.engine }}
          path: /tmp

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-flags: "--debug"

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        id: bake
        uses: docker/bake-action@v7
        env:
          # A bake `variable` is read from the environment. `set:` would not do
          # it -- that addresses target fields and Dockerfile ARGs, and ENGINE
          # is neither: it chooses which Dockerfile the target points at.
          ENGINE: ${{ matrix.engine }}
        with:
          # bake-action v7 defaults `source` to the remote git URL, which makes
          # `files` resolve inside that context rather than the local checkout.
          # The meta bake file lives on the runner, so pin source to the workspace.
          source: .
          files: |
            .github/workflows/docker-bake.hcl
            /tmp/bake-meta.json
          targets: image
          sbom: true
          provenance: true
          # The cache scope carries the engine as well as the platform, or
          # three different images would evict each other from one scope.
          set: |
            *.tags=
            *.platform=${{ matrix.platform }}
            *.cache-from=type=gha,scope=build-${{ matrix.engine }}-${{ env.PLATFORM_PAIR }}
            *.cache-to=type=gha,scope=build-${{ matrix.engine }}-${{ env.PLATFORM_PAIR }}
            *.output=type=image,"name=${{ env.DOCKERHUB_SLUG }},${{ env.GHCR_SLUG }}",push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ fromJSON(steps.bake.outputs.metadata).image['containerimage.digest'] }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v5
        with:
          name: digests-${{ matrix.engine }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Per engine: each has its own manifest list, its own tags and its own
  # attestation subject, so this cannot be one job over all the digests.
  merge:
    runs-on: ubuntu-latest

    if: github.event_name != 'pull_request'

    needs:
      - prepare
      - build

    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJson(needs.prepare.outputs.engines) }}

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Download meta bake definition
        uses: actions/download-artifact@v6
        with:
          name: bake-meta-${{ matrix.engine }}
          path: /tmp

      # This engine's digests only -- every platform of it, and nothing from
      # the other engines, which are being merged by their own copy of this job.
      - name: Download digests
        uses: actions/download-artifact@v6
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.engine }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Note, I'm still not sure what's meant to be happening here. This is my best guess.

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both registry logins happen up-front, before any buildx work. The
      # DockerHub push below copies blobs from DockerHub back into DockerHub,
      # so the builder needs Hub credentials available from the start.
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list and push (GHCR)
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
              $(jq -cr \
                '.target."docker-metadata-action".tags | map(select(startswith("${{ env.GHCR_SLUG }}")) | "-t " + .) | join(" ")' \
              /tmp/bake-meta.json) \
            $(printf '${{ env.GHCR_SLUG }}@sha256:%s ' *)

      - name: Inspect image (GHCR)
        id: inspect_ghcr
        run: |
          TAG=$(jq -r '.target."docker-metadata-action".args.DOCKER_META_VERSION' /tmp/bake-meta.json)
          docker buildx imagetools inspect \
            ${{ env.GHCR_SLUG }}:${TAG} \
            --format "{{json .Manifest}}" | jq -r '"GHCR_DIGEST=" + .digest' >> $GITHUB_ENV

      - name: Generate artifact attestation (GHCR)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.GHCR_SLUG }}
          subject-digest: ${{ env.GHCR_DIGEST }}
          push-to-registry: true

      - name: Create manifest list and push (DockerHub)
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
              $(jq -cr \
                '.target."docker-metadata-action".tags | map(select(startswith("${{ env.DOCKERHUB_SLUG }}")) | "-t " + .) | join(" ")' \
              /tmp/bake-meta.json) \
              $(printf '${{ env.DOCKERHUB_SLUG }}@sha256:%s ' *)

      - name: Inspect image (DockerHub)
        id: inspect_dockerhub
        run: |
          TAG=$(jq -r '.target."docker-metadata-action".args.DOCKER_META_VERSION' /tmp/bake-meta.json)
          docker buildx imagetools inspect \
            ${{ env.DOCKERHUB_SLUG }}:${TAG} \
            --format "{{json .Manifest}}" | jq -r '"DOCKERHUB_DIGEST=" + .digest' >> $GITHUB_ENV

      - name: Generate artifact attestation (DockerHub)
        uses: actions/attest-build-provenance@v4
        with:
          # Must be fully qualified: a bare `owner/repo` gives the action no
          # registry host to match a credential against.
          subject-name: docker.io/${{ env.DOCKERHUB_SLUG }}
          subject-digest: ${{ env.DOCKERHUB_DIGEST }}
          push-to-registry: true

  # The bundled distribution: a tarball install.sh downloads and unpacks.
  # Architecture-independent -- shell and JavaScript, with node_modules
  # installed on the target machine -- so one build serves every platform.
  dist:
    runs-on: ubuntu-latest

    # Tags only. A tarball is only useful once there's a release to attach it
    # to, and `latest` must not drift to an untagged commit.
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write
      attestations: write
      id-token: write
      # For the `gh workflow run pages.yaml` call at the end: dispatching a
      # workflow is an Actions write, and without it the step 403s *after* the
      # release has already been published -- leaving /manifest stale.
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      # The lockfile ships inside the tarball, so it has to be the one we
      # actually resolved -- a stale lockfile would break every install.
      #
      # Per engine, not at the repository root: v3 has no root package.json.
      # A JS engine carries its own, because a `pandoc-xslt` user never meets
      # bun and should not be made to install its dependencies.
      #
      # Under _nopayload/, with the rest of the engine's program: dependencies
      # are what the engine runs, not content a payload carries.
      - name: Verify lockfiles are current
        run: |
          for pkg in engines/*/_nopayload/package.json; do
            echo "==> ${pkg%/package.json}"
            ( cd "$(dirname "$pkg")" && bun install --frozen-lockfile )
          done

      # VERSION goes into the tarball, and is what `--update` compares against.
      # It must be the tag, not `git describe`: a checkout at a tag would
      # otherwise be indistinguishable from a developer's working tree, and
      # --update refuses to overwrite those.
      - name: Build tarball
        run: make dist pdfulator.tar.gz.sha256 VERSION="${{ github.ref_name }}"

      # A smoke test worth having: install.sh is the thing every user runs
      # first, and a broken one is invisible until someone tries it.
      - name: Install it, as a user would
        run: |
          PDFULATOR_HOME="$RUNNER_TEMP/pdf-home" \
          PDFULATOR_BIN="$RUNNER_TEMP/pdf-bin" \
          PDFULATOR_TARBALL="$PWD/pdfulator.tar.gz" \
            ./install.sh
          test -x "$RUNNER_TEMP/pdf-bin/pdfulator"
          test -f "$RUNNER_TEMP/pdf-home/.manifest"

      - name: Convert a document end to end
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq chromium
          export PATH="$RUNNER_TEMP/pdf-bin:$PATH"
          export PDFULATOR_HOME="$RUNNER_TEMP/pdf-home" PDFULATOR_BIN="$RUNNER_TEMP/pdf-bin"
          pdfulator --browser /usr/bin/chromium
          pdfulator README.md "$RUNNER_TEMP/out.pdf"
          # Must be a real PDF, not an empty file or an error page.
          head -c 5 "$RUNNER_TEMP/out.pdf" | grep -q '%PDF-'

      # The update matrix builds its own releases and serves them locally, so it
      # exercises the whole download/verify/swap path without needing this tag
      # to be published first.
      - name: Test the update path
        run: bash tests/updatematrix.sh

      # updatematrix rebuilds the tarball at its own test versions; restore the
      # one that gets attested and published.
      - name: Rebuild the release tarball
        run: make dist pdfulator.tar.gz.sha256 VERSION="${{ github.ref_name }}"

      - name: Attest the tarball
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: pdfulator.tar.gz

      - name: Publish to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pdfulator.tar.gz
            pdfulator.tar.gz.sha256
            install.sh
          fail_on_unmatched_files: true
          # Not inferred from the tag name: without this, v3.0.0-alpha1
          # publishes as a full release and becomes GitHub's "Latest" -- what
          # anyone landing on the releases page is offered first.
          #
          # Deliberately stricter than the Docker moving-latest tag above,
          # which does move on prereleases for now. A pinned image pulled by
          # name is an explicit act; the releases page is where people who have
          # not chosen anything end up.
          prerelease: ${{ contains(github.ref_name, '-') }}

      # Refresh the site so /manifest lists the release we just made. This has
      # to be an explicit call: the release was created with GITHUB_TOKEN, and
      # GitHub suppresses workflow triggers from token-created events, so a
      # `release: published` trigger in pages.yaml would never fire.
      # Refresh /manifest so `pdfulator --update` can see the release we just
      # published. This has to be an explicit dispatch: the release was created
      # with GITHUB_TOKEN, and GitHub suppresses workflow triggers from
      # token-created events, so a `release: published` trigger never fires.
      #
      # Not fatal, deliberately -- the release is already out by now, and
      # failing here would mark a good release as broken over a manifest that
      # can be rebuilt by hand. But "not fatal" must not mean "silent": the
      # step verifies the dispatch actually took effect and writes the outcome
      # to the job summary, so a permissions regression is visible on the run
      # page instead of only in a timestamp nobody thinks to check.
      - name: Rebuild the site
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_REF: ${{ vars.PAGES_REF || 'v2' }}
        run: |
          before=$(curl -fsSL https://pdfulator.app/manifest 2>/dev/null |
                   sed -n 's/^# newest first; generated //p')

          # --ref names the branch pages.yaml is read and built from, so it
          # must track wherever the site content lives -- not the tag being
          # released, which has no pages.yaml trigger of its own.
          if ! gh workflow run pages.yaml --repo "$GITHUB_REPOSITORY" \
                 --ref "$PAGES_REF"; then
            {
              echo "### ⚠️ Site rebuild could not be dispatched"
              echo ""
              echo "The release published fine, but \`/manifest\` was not refreshed,"
              echo "so \`pdfulator --update\` will not offer **${GITHUB_REF_NAME}** yet."
              echo ""
              echo "Fix: re-run the \`pages\` workflow manually, and check the"
              echo "\`dist\` job still has \`actions: write\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Dispatch accepted != manifest rebuilt. Poll for the generated
          # timestamp to move, so a pages.yaml that fails on its own terms is
          # reported here rather than looking like success.
          for _ in $(seq 1 30); do
            sleep 10
            after=$(curl -fsSL https://pdfulator.app/manifest 2>/dev/null |
                    sed -n 's/^# newest first; generated //p')
            if [ -n "$after" ] && [ "$after" != "$before" ]; then
              if curl -fsSL https://pdfulator.app/manifest |
                 grep -q "^${GITHUB_REF_NAME}$(printf '\t')"; then
                echo "### ✅ /manifest refreshed, listing ${GITHUB_REF_NAME}" \
                  >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              echo "### ⚠️ /manifest rebuilt but does not list ${GITHUB_REF_NAME}" \
                >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done

          {
            echo "### ⚠️ /manifest did not refresh within 5 minutes"
            echo ""
            echo "The dispatch was accepted, so check the \`pages\` workflow."
            echo "\`pdfulator --update\` will not offer **${GITHUB_REF_NAME}**"
            echo "until \`/manifest\` lists it."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
