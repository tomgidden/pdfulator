# The vivlio engine: the standard one, and what v2 was before it had rivals.
#
# Markdown through markdown-it, laid out by the Vivliostyle viewer, printed by
# Chromium. Bundled rather than containerised, so it runs on the user's own
# machine with the user's own fonts -- which is the reason it is the default:
# a document that renders differently on your laptop than on the build server
# is a surprise nobody asked for.
#
# The parser/styler/renderer keys are metadata, shown by --list-engines. They
# describe the pipeline rather than configure it: there are no dials here, only
# a description of what this engine is.

id=vivlio
description=Markdown via markdown-it, paginated by Vivliostyle, rendered by Chromium
internal=no
deprecated=no

needs_runtime=js
needs_browser=yes
needs_docker=no
image=

parser=markdown-it
styler=vivliostyle
renderer=chromium

# The template ecosystem: HTML + Mustache, Vivliostyle DOM. Shared with the
# other vivlio engine -- same renderer, so the same template is correct for both.
template=html-mustache-vivlio

# The wrapper's entry point into this engine, and where it lives. Declared
# rather than found by a fixed name: the only paths pdfulator hardcodes are the
# conf files themselves, and everything an object owns is named BY its conf
# file. That is the same rule `markup` and `stylesheet` follow.
#
# It sits at the engine root because that reads well, not because anything
# requires it -- `./_nopayload/convert` would work identically. Since it is the
# program rather than content, it is excluded from the payload: an executable
# in a directory that gets mounted into a container or sent to a remote host
# has no business being there. `+` adds to the default, so _nopayload/ stays
# excluded too.
convert        = ./convert
do.not.payload = +convert
