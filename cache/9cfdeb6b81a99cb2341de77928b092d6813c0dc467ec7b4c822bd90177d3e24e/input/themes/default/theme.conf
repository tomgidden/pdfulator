# themes/default — the floor every other theme stands on.
#
# Base-14 fonts and nothing else: no layout, no page furniture, no downloads.
# This is what `pdfulator doc.md` gives you with no --theme at all, and it must
# work on a machine that has never been online, immediately, with nothing
# fetched. That constraint is what makes the rest of the font design
# acceptable -- if the default needed a download, first run would be a cliff.

name = default
description = Standard PDF fonts, minimal styling

# Named rather than left to the `print.css` convention. The convention still
# works, but a file called print.css tells you nothing about where it came
# from once several are concatenated, and the staged directory now keeps that
# provenance -- so the shipped themes carry names worth keeping.
stylesheet = ./default.theme.css

# Fonts: the base-14 PDF fonts, the one typographic choice that cannot fail.
#
# `source = none` means exactly that -- no file to find, no URL to fetch. Every
# PDF reader has these built in, so the unthemed case renders offline,
# immediately, with nothing fetched. That is what makes download-on-first-use
# acceptable for every other theme: the floor never needs the network.
#
# The names are the base-14 ones rather than being left implicit. A font is a
# definition now, and a definition with no name is not one.
font.times.name     = Times
font.times.source   = none
font.helvetica.name   = Helvetica
font.helvetica.source = none
font.courier.name   = Courier
font.courier.source = none

style.body.font    = times
style.heading.font = helvetica
style.mono.font    = courier
