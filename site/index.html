<h1>pdfulator</h1>
<p>Markdown to PDF, with real page layout.</p>
<pre><code>curl -fsSL https://pdfulator.app/get | sh</code></pre>
<p>Or with <a href="https://hub.docker.com/r/tomgidden/pdfulator">Docker</a>:</p>
<pre><code>docker run --rm --init -i tomgidden/pdfulator:2 - &lt; foo.md &gt; foo.pdf</code></pre>
<p><a href="https://github.com/tomgidden/pdfulator">Source and documentation on GitHub</a></p>
