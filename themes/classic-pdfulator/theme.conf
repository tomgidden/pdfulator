# themes/classic-pdfulator — classic, with pdfulator's own logo.
#
# The whole theme. There is no CSS here and no template: `extends` brings the
# entire classic look, and the logo is placed by the rule pdfulator generates
# from the three keys below.
#
# This exists as much as an example as for its own sake. A company wanting its
# documents to carry its mark needs precisely this: a directory, a logo file,
# and four lines. Copy it, drop your own logo.svg in, change the name.

name = classic-pdfulator
description = The classic look, with the pdfulator logotype in the corner
extends = classic

logo.file     = logo.svg
logo.position = top right
logo.height   = 18pt
logo.margin   = 9pt
