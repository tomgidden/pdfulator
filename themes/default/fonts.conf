# The base-14 PDF fonts: Times, Helvetica and Courier.
#
# `source = none` means exactly that -- no file to find, no URL to fetch. Every
# PDF reader has these built in, so they are the one typographic choice that
# cannot fail. A theme wanting real fonts overrides the roles it cares about
# and inherits the rest from here.
#
# The family names are omitted deliberately: with no family declared, each role
# resolves to its own base-14 name (fonts_base14), so this file says "use the
# standard fonts" once rather than three times.

body.source    = none
heading.source = none
mono.source    = none
