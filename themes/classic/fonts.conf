# TeX Gyre Pagella (a Palatino), Open Sans, Noto Sans Mono.
#
# Weights and styles are named explicitly even for the variable fonts. A
# variable font carries its own axes, but the declaration has to say which
# weights this theme actually uses: FOP needs one triplet per weight it will
# be asked for, and a CSS @font-face without a weight claims 400 only. Naming
# them here is what makes the same declaration serve both.

body.family = TeX Gyre Pagella
body.source = local
body.face.400.normal.file     = fonts/texgyrepagella-regular.otf
body.face.400.italic.file     = fonts/texgyrepagella-italic.otf
body.face.700.normal.file     = fonts/texgyrepagella-bold.otf
body.face.700.italic.file     = fonts/texgyrepagella-bolditalic.otf

heading.family = Open Sans
heading.source = local
heading.face.400.normal.file  = fonts/OpenSans-Variable.ttf
heading.face.400.italic.file  = fonts/OpenSans-Italic-Variable.ttf
heading.face.600.normal.file  = fonts/OpenSans-Variable.ttf
heading.face.700.normal.file  = fonts/OpenSans-Variable.ttf

mono.family = Noto Sans Mono
mono.source = local
mono.face.400.normal.file     = fonts/NotoSansMono-Variable.ttf
