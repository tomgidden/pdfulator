# The xsl-fo styler's view of the heading font.
#
# FOP cannot read WOFF or WOFF2, and matches faces by the family name in the
# font-triplet rather than by a URL. Both are handled by the generators, not
# here -- this exists only to say that the *variable* font the CSS stylers use
# is not what FOP should be given.
#
# A variable TTF registers with FOP as its default instance, so asking for 600
# or 700 silently returns 400. The CSS engines interpolate the axis and get a
# real semibold; FOP would give a regular that merely claims to be bold. Until
# static instances are bundled for it, this styler asks for 400 only and lets
# FOP synthesise emphasis, which is at least visible for what it is.
#
# The WHOLE font is restated, not just the faces to drop. A font is one thing
# and merges wholesale per id (§7): restating a subset of the faces is exactly
# the partial override the model exists to make unrepresentable. The paths
# climb out of this directory because a `local` file resolves relative to the
# conf that declared it, and the fonts belong to the theme rather than to this
# styler's view of it.
font.opensans.name   = Open Sans
font.opensans.source = local
font.opensans.face.400.normal.file = ../../fonts/OpenSans-Variable.ttf
font.opensans.face.400.italic.file = ../../fonts/OpenSans-Italic-Variable.ttf
