# The xsl-fo styler's view of the same three fonts.
#
# FOP cannot read WOFF or WOFF2, and matches faces by the family name in the
# font-triplet rather than by a URL. Both are handled by the generators, not
# here -- this file exists only to say that the *variable* fonts the CSS
# stylers use are not what FOP should be given.
#
# A variable TTF registers with FOP as its default instance, so asking for 600
# or 700 silently returns 400. The CSS engines interpolate the axis and get a
# real semibold; FOP would give a regular that merely claims to be bold. Until
# static instances are bundled for it, this styler asks for 400 only and lets
# FOP synthesise emphasis, which is at least visible for what it is.
#
# The paths climb out of this directory because a `local` file is resolved
# relative to the conf that declared it, and the fonts belong to the theme
# rather than to this styler's view of it.

heading.family = Open Sans
heading.source = local
heading.face.400.normal.file = ../../fonts/OpenSans-Variable.ttf
heading.face.400.italic.file = ../../fonts/OpenSans-Italic-Variable.ttf
