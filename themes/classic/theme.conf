# themes/classic — the white-paper look pdfulator shipped as its default.
#
# Extends `default`, so it inherits the resets and only states its
# differences: real fonts, a page layout, and the running headers and footers.
#
# The fonts are bundled rather than downloaded. They are open-licensed (see
# fonts/OFL.txt), they are what this theme *is*, and a default look that needs
# the network to render is not a default look. A theme fetching its fonts is
# perfectly possible -- see the `url` source in fonts.conf's documentation --
# and is the right choice for a theme someone installs on purpose.

name = classic
description = The white-paper look: TeX Gyre Pagella, Open Sans, Noto Sans Mono
extends = default

# No logo here on purpose. This theme is the *look*, and a look is not a
# brand: dropping a logo.svg beside a theme.conf that says `extends = classic`
# is all it takes to have your own on every page -- see themes/classic-pdfulator,
# which is exactly that and nothing else.
#
#   logo.file     = logo.svg     (optional; found automatically if named so)
#   logo.position = top right
#   logo.height   = 18pt
#   logo.margin   = 9pt
