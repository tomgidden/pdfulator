# themes/classic — the white-paper look pdfulator shipped as its default.
#
# Extends `default`, so it inherits the resets and only states its
# differences: real fonts, a page layout, and the running headers and footers.
#
# The fonts are bundled rather than downloaded. They are open-licensed (see
# fonts/OFL.txt), they are what this theme *is*, and a default look that needs
# the network to render is not a default look. A theme fetching its fonts is
# perfectly possible -- see the `url` source in the font documentation --
# and is the right choice for a theme someone installs on purpose.

name = classic
description = The white-paper look: TeX Gyre Pagella, Open Sans, Noto Sans Mono
extends = default

# No logo here on purpose. This theme is the *look*, and a look is not a
# brand: dropping a logo.svg beside a theme.conf that says `extends = classic`
# is all it takes to have your own on every page -- see themes/classic-pdfulator,
# which is exactly that and nothing else.
#
#   logo.file     = logo.svg     (optional; found automatically if named so)
#   logo.position = top right
#   logo.height   = 18pt
#   logo.margin   = 9pt

# Fonts: TeX Gyre Pagella (a Palatino), Open Sans, Noto Sans Mono.
#
# Weights and styles are named explicitly even for the variable fonts. A
# variable font carries its own axes, but the declaration has to say which
# weights this theme actually uses: FOP needs one triplet per weight it will be
# asked for, and a CSS @font-face without a weight claims 400 only. Naming them
# here is what makes the same declaration serve both.
font.pagella.name   = TeX Gyre Pagella
font.pagella.source = local
font.pagella.face.400.normal.file     = fonts/texgyrepagella-regular.otf
font.pagella.face.400.italic.file     = fonts/texgyrepagella-italic.otf
font.pagella.face.700.normal.file     = fonts/texgyrepagella-bold.otf
font.pagella.face.700.italic.file     = fonts/texgyrepagella-bolditalic.otf

font.opensans.name   = Open Sans
font.opensans.source = local
font.opensans.face.400.normal.file  = fonts/OpenSans-Variable.ttf
font.opensans.face.400.italic.file  = fonts/OpenSans-Italic-Variable.ttf
font.opensans.face.600.normal.file  = fonts/OpenSans-Variable.ttf
font.opensans.face.700.normal.file  = fonts/OpenSans-Variable.ttf

font.notosansmono.name   = Noto Sans Mono
font.notosansmono.source = local
font.notosansmono.face.400.normal.file = fonts/NotoSansMono-Variable.ttf

style.body.font    = pagella
style.heading.font = opensans
style.mono.font    = notosansmono
