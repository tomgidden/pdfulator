# DocBook 5 + pandoc $var$.
#
# Used by the pandoc-xslt engine. The same parser and the same template syntax
# as html-pandoc-pagedjs, and a completely different format: this one produces
# DocBook 5 XML, which xsltproc then turns into XSL-FO for FOP. So the two
# pandoc templates are not interchangeable either, despite sharing a dialect --
# the grouping is format *and* templating language *and* target, all three.
#
# The structural file is not here. It lives in the engine's xsl/ directory
# beside fo.xsl, global.ent and titlepages.xsl, which it is written against and
# which resolve relative to each other; moving it out of that set to sit under
# templates/ would separate files that only make sense together. A template may
# name a structure anywhere, so the reference points back at it rather than the
# file being relocated to suit the convention.

template.structure = ../../engines/pandoc-xslt/xsl/global.tmpl

# global.tmpl opens with
#
#   <!ENTITY % entities SYSTEM "global.ent"> %entities;
#
# and a SYSTEM identifier resolves relative to the file naming it, so the
# entity file has to land beside the template in the staged directory. Without
# it pandoc fails while parsing the DTD subset, before any conversion starts.
template.support = ../../engines/pandoc-xslt/xsl/global.ent
