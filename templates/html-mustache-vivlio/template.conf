# HTML + Mustache, targeting the Vivliostyle DOM.
#
# Used by the vivlio and vivlio-docker engines, which share it by construction:
# they are the same renderer, one bundled and one containerised, so a template
# written for one is correct for the other.
#
# The syntax is Mustache ({{title}}), filled by engines/vivlio/main.js after
# markdown-it has parsed the document. That is worth stating because the
# markdown parser and the template renderer are separate components here --
# unlike the pandoc engines, where one tool does both jobs and the syntax is
# pandoc's own $title$. Handing this file to pandoc produces a PDF with the
# Mustache markup printed in it as literal text, which is the bug this object
# type exists to make impossible.

markup = ./template.html.mustache

# The maths stylesheet.
#
# KaTeX renders `$x$` to a specific DOM -- .katex, .katex-mathml, .katex-html
# and a good deal of positioning -- and this is the sheet that makes that DOM
# look like mathematics. It belongs here rather than to either vivlio engine
# for the reason this object type exists: a template owns a DOM and the styling
# that DOM needs, and BOTH vivlio engines share this template. Hanging it off
# the engine instead put the CSS in vivlio-docker's payload without the fonts
# it references, because the mirror stages whole selected objects and
# engines/vivlio is not one when vivlio-docker is the engine. Same document,
# different rendering, no error: exactly the divergence the object model is
# supposed to prevent.
#
# Level 10, below every theme band, so a theme can restyle maths -- change its
# colour, its size relative to the text -- without fighting specificity.
#
# See katex/README.md for why these assets are vendored rather than read from
# the engine's node_modules.
stylesheet = ./katex/katex.min.css
