# HTML + pandoc $var$, targeting the Paged.js DOM.
#
# Used by the pandoc-pagedjs engine, where pandoc both parses the Markdown and
# fills the template in a single pass -- so the template syntax is pandoc's
# ($title$, $if(copyright)$...$endif$) rather than Mustache.
#
# Same ancestry as templates/html-mustache-vivlio/article.tmpl and very nearly
# the same markup, which is exactly why the two must not be interchangeable:
# they differ only in the syntax of their placeholders, so a mix-up produces a
# document that renders without error and has the markup printed in it.

template.structure = ./article.tmpl
