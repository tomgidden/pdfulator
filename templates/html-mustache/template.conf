# HTML + Mustache, for the markdown-it engines.
#
# Shared by `vivlio`, `vivlio-docker` and `pagedjs` -- every engine whose
# pipeline is markdown-it + Mustache, whichever paginator finishes the job.
# That sharing is the point rather than a convenience: if each engine had its
# own copy they would drift, and a drift in the markup shows up as a rendering
# difference that looks like a paginator bug. One template means a difference
# between those engines' output is genuinely the paginator's.
#
# NOT shared with the pandoc engines, and that is not an oversight. Their
# template syntax is pandoc's own `$title$`; handing them this file produces a
# PDF with Mustache markup printed in it as text, which is the bug this object
# type exists to make impossible. templates/html-pandoc-pagedjs stays separate.
#
# --- RUNNING-CONTENT SLOTS ---------------------------------------------------
#
# The markup emits slots named by ROLE. Where each role appears on the page is
# the STYLER's business, because the two paginators express it differently --
# Vivliostyle with `string-set`/`string()`, Paged.js with
# `position: running()`/`element()` -- and because CSS's sixteen margin boxes
# are all physical. A slot named `footer-left` would have decided a side before
# the theme got a say, and would need a second set of names the moment anyone
# wanted recto/verso or RTL.
#
# The roles, and the vocabulary a styler must map:
#
#   running-title      the document title, on every page
#   running-section    the current section, for a styler that tracks headings
#   attribution        copyright, footer text and revision
#   page-number        the page counter
#
# A role nothing maps renders nowhere, silently. That is the cost of the
# indirection and the reason to keep this list short: add a role when a theme
# needs it, not in anticipation.
#
# Overriding the mapping needs no new mechanism. A role-to-margin-box mapping
# IS a stylesheet, so a theme that wants the title bottom-centre writes one CSS
# rule at level 20 or 25, above the styler's level 40. Inventing a mapping
# format would mean a second cascade that has to agree with the CSS one, which
# is the same mistake as having two parsers.
#
# ONE PAGINATOR DIFFERENCE THE ABSTRACTION CANNOT HIDE: Vivliostyle's
# `string-set` carries TEXT, Paged.js's `running()` carries an ELEMENT. A slot
# containing `<em>` or a link renders marked up under `pagedjs` and flattened
# under `vivlio`. That is a capability difference between the paginators, not
# something this file can paper over -- see DIALECT.md.

markup = ./template.html.mustache

# The maths stylesheet.
#
# KaTeX renders `$x$` to a specific DOM -- .katex, .katex-mathml, .katex-html
# and a good deal of positioning -- and this is the sheet that makes that DOM
# look like mathematics. It belongs to the template because a template owns a
# DOM and the styling that DOM needs, and every engine sharing this template
# needs it. Hanging it off an engine instead put the CSS in vivlio-docker's
# payload without the fonts it references, because the mirror stages whole
# selected objects and engines/vivlio is not one when vivlio-docker is the
# engine. Same document, different rendering, no error.
#
# Level 10, below every theme band, so a theme can restyle maths -- change its
# colour, its size relative to the text -- without fighting specificity.
#
# See katex/README.md for why these assets are vendored rather than read from
# the engine's node_modules.
stylesheet = ./katex/katex.min.css
