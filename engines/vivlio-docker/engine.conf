# The vivlio-docker engine: the vivlio pipeline, in a container.
#
# Same parser, same styler, same renderer as `vivlio` -- and deliberately so.
# What differs is not the output but the dependencies: nothing is installed on
# the host, no bun, no Chromium, no node_modules. The image carries all of it.
#
# The trade is fonts. A container has only the fonts baked into it, so a
# document that leans on something installed locally renders differently here
# than under `vivlio`. That is why `vivlio` remains the default and this is the
# opt-in: reproducible-everywhere and looks-like-my-laptop are different wants,
# and only the user knows which they have.
#
# needs_runtime is `none` even though the pipeline is JavaScript throughout:
# the requirement keys describe what the *host* must provide, and the host
# provides docker. The runtime inside the image is the image's business.

id=vivlio-docker
description=As vivlio, but containerised: no runtime, browser or deps on the host
internal=no
deprecated=no

needs_runtime=none
needs_browser=no
needs_docker=yes
image=tomgidden/pdfulator:vivlio

parser=markdown-it
styler=vivliostyle
renderer=chromium

# The template ecosystem: HTML + Mustache, Vivliostyle DOM. Shared with the
# other vivlio engine -- same renderer, so the same template is correct for both.
template=html-mustache-vivlio

# The wrapper's entry point into this engine, and where it lives. Declared
# rather than found by a fixed name: the only paths pdfulator hardcodes are the
# conf files themselves, and everything an object owns is named BY its conf
# file. That is the same rule `markup` and `stylesheet` follow.
#
# It sits at the engine root because that reads well, not because anything
# requires it -- `./_nopayload/convert` would work identically. Since it is the
# program rather than content, it is excluded from the payload: an executable
# in a directory that gets mounted into a container or sent to a remote host
# has no business being there. `+` adds to the default, so _nopayload/ stays
# excluded too.
convert        = ./convert
do.not.payload = +convert
