# The pagedjs engine: markdown-it + Mustache + Paged.js.
#
# The same pipeline as `vivlio` as far as the HTML -- same parser, same plugin
# list, same template -- and a different paginator after it. That is the point
# rather than a coincidence: engines/vivlio/_nopayload/markdown.js is imported
# by both, so a difference between their output is the paginator's and not a
# drift in what Markdown means.
#
# NOT `pandoc-pagedjs`, which targets the same paginator from a completely
# different front end: pandoc parses it and a pandoc template fills it. The two
# share a styler and nothing else.
#
# The parser/styler/renderer keys are metadata, shown by --list-engines. They
# describe the pipeline rather than configure it.

id=pagedjs
description=markdown-it + Mustache + Paged.js, rendered by an external browser
internal=no
deprecated=no

needs_runtime=js
needs_browser=yes
needs_docker=no
image=

parser=markdown-it
styler=pagedjs
renderer=chromium

# HTML + Mustache, shared with every markdown-it engine -- see
# templates/html-mustache/template.conf, and the note there on running-content
# slots being named by role so that the styler decides where they land.
template=html-mustache

convert        = ./convert
do.not.payload = +convert
