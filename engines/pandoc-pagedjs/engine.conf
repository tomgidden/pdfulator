# The pandoc-pagedjs engine: v1's pipeline, rebuilt.
#
# Pandoc parses the markdown and fills a template; Paged.js paginates the
# resulting HTML; Chromium prints it. This is what pdfulator was before
# Vivliostyle, and it is kept because it is genuinely different rather than
# merely older -- pandoc reads far more markdown than markdown-it does, and
# `commonmark_x` brings definition lists, footnotes and tables that the vivlio
# engine does not have.
#
# Container-only, so no `-docker` suffix: the `pandoc-` prefix already implies
# it. Pandoc, Paged.js and Chromium is not a stack anyone should be asked to
# install to convert a document, and unlike vivlio there is no reason to
# prefer the host's own fonts -- this pipeline never rendered with them.
#
# Rebuilt from v1's components rather than ported: the pandoc invocation, the
# lua filter and the template are kept, and v1's zsh entrypoint is not. That
# entrypoint was a third job planner -- alongside pdfulator.js's main() and
# v0's GNUmakefile -- and they disagreed with each other. The wrapper plans;
# this engine converts one document.

id=pandoc-pagedjs
description=Markdown via Pandoc, paginated by Paged.js, rendered by Chromium
internal=no
deprecated=no

needs_runtime=none
needs_browser=no
needs_docker=yes
image=tomgidden/pdfulator:pandoc-pagedjs

parser=pandoc
styler=pagedjs
renderer=chromium

# The template ecosystem: HTML + pandoc $var$, Paged.js DOM. NOT the Mustache
# one the vivlio engines use, despite the near-identical markup.
template=html-pandoc-pagedjs
