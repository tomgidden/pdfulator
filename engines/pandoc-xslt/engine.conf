# The pandoc-xslt engine: v0's pipeline, the oldest one still standing.
#
# Markdown -> DocBook 5 -> XSL-FO -> PDF. Pandoc emits DocBook as an
# intermediate; the DocBook XSL stylesheets turn that into XSL-FO; Apache FOP
# lays it out and writes the PDF. Four formats and three tools, where the other
# engines use one browser -- which is the point: this is a typesetting
# pipeline, not a rendering one, and it produced the best-looking output of the
# lot. That output is the reason it is preserved.
#
# Deprecated from the day it ships, and marked so. XSL-FO is a dead standard,
# FOP is the only implementation still maintained, and DocBook is a niche
# inside a niche. It is here because the XSLT is a real asset -- fifteen years
# of accumulated layout work, from 2009 through to 2024 -- not because anyone
# should start a new document with it.
#
# Container-only, hence no `-docker` suffix: the `pandoc-` prefix implies it.
# It could run natively off a host JRE, and deliberately does not. A deprecated
# engine should not be asking anyone to install Java, and pinning FOP inside
# the image is what stops "it renders differently now" a decade from now.

id=pandoc-xslt
description=Markdown via Pandoc and DocBook, typeset by XSL-FO and Apache FOP
internal=no
deprecated=yes

needs_runtime=none
needs_browser=no
needs_docker=yes
image=tomgidden/pdfulator:pandoc-xslt

parser=pandoc
styler=xsl-fo
renderer=fop

# The template ecosystem: DocBook 5 + pandoc $var$, styled through XSL-FO.
template=docbook5-pandoc
