# The null engine: produces a valid but empty PDF, instantly.
#
# Not for users. It exists so the framework can be tested without dragging in a
# browser, a JS runtime or Docker -- which means it is also the only engine that
# tests the *contract* rather than a particular renderer. Every other engine has
# heavy dependencies, so a failure there is ambiguous: framework or engine? Here
# it can only be the framework.
#
# `internal=yes` keeps it out of --list-engines unless asked for.

id=null
description=Test engine: emits a minimal valid PDF recording what it was asked to do
internal=yes
deprecated=no

needs_runtime=none
needs_browser=no
needs_docker=no
image=

parser=none
styler=none
renderer=none

# `convert` is the wrapper's entry point into this engine, found by name at the
# engine's root -- so unlike the rest of the program it cannot live under
# _nopayload/. It is still the program, and an executable in a directory that
# gets mounted into a container or sent to a remote host has no business being
# there, so it is excluded by name. `+` adds to the default rather than
# replacing it: _nopayload/ is still excluded too.
do.not.payload = +convert
