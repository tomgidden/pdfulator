# The null engine: produces a valid but empty PDF, instantly.
#
# Not for users. It exists so the framework can be tested without dragging in a
# browser, a JS runtime or Docker -- which means it is also the only engine that
# tests the *contract* rather than a particular renderer. Every other engine has
# heavy dependencies, so a failure there is ambiguous: framework or engine? Here
# it can only be the framework.
#
# `internal=yes` keeps it out of --list-engines unless asked for.

id=null
description=Test engine: emits a minimal valid PDF recording what it was asked to do
internal=yes
deprecated=no

needs_runtime=none
needs_browser=no
needs_docker=no
image=

parser=none
styler=none
renderer=none

# The wrapper's entry point into this engine, and where it lives. Declared
# rather than found by a fixed name: the only paths pdfulator hardcodes are the
# conf files themselves, and everything an object owns is named BY its conf
# file. That is the same rule `markup` and `stylesheet` follow.
#
# It sits at the engine root because that reads well, not because anything
# requires it -- `./_nopayload/convert` would work identically. Since it is the
# program rather than content, it is excluded from the payload: an executable
# in a directory that gets mounted into a container or sent to a remote host
# has no business being there. `+` adds to the default, so _nopayload/ stays
# excluded too.
convert        = ./convert
do.not.payload = +convert
